<body>
    <div class="header">

    <!-- áudio será inserido dentro da conversa -->

    <script>
        const chat = document.getElementById('chat');
        // áudio será inserido dentro da conversa

        const voiceId = 'RGymW84CSmfVugnA5tvA';
        const modelId = 'eleven_multilingual_v2';
        const language = 'pt-BR';

        // Função centralizada para auto-scroll
        function scrollToBottom() {
            requestAnimationFrame(() => {
                chat.scrollTop = chat.scrollHeight;
            });
        }

        // MutationObserver para auto-scroll quando novos elementos são adicionados
        let scrollTimeout;
        const observer = new MutationObserver(() => {
            // Debounce para evitar scrolls excessivos
            clearTimeout(scrollTimeout);
            scrollTimeout = setTimeout(() => {
                scrollToBottom();
            }, 50);
        });

        // Observar mudanças no chat
        if (chat) {
            observer.observe(chat, {
                childList: true,
                subtree: true
            });
        }

        function formatCPF(value) {
            // Remove tudo que não é dígito
            const cpf = value.replace(/\D/g, '');
            // Aplica a máscara
            if (cpf.length <= 3) return cpf;
            if (cpf.length <= 6) return cpf.replace(/(\d{3})(\d)/, '$1.$2');
            if (cpf.length <= 9) return cpf.replace(/(\d{3})(\d{3})(\d)/, '$1.$2.$3');
            return cpf.replace(/(\d{3})(\d{3})(\d{3})(\d)/, '$1.$2.$3-$4');
        }

        function validateCPF(cpf) {
            const clean = cpf.replace(/\D/g, '');
            if (clean.length !== 11) return false;
            // Verifica se todos os dígitos são iguais
            if (/^(\d)\1{10}$/.test(clean)) return false;
            // Validação básica dos dígitos verificadores
            let sum = 0;
            for (let i = 0; i < 9; i++) {
                sum += parseInt(clean.charAt(i)) * (10 - i);
            }
            let digit = 11 - (sum % 11);
            if (digit >= 10) digit = 0;
            if (digit !== parseInt(clean.charAt(9))) return false;
            sum = 0;
            for (let i = 0; i < 10; i++) {
                sum += parseInt(clean.charAt(i)) * (11 - i);
            }
            digit = 11 - (sum % 11);
            if (digit >= 10) digit = 0;
            return digit === parseInt(clean.charAt(10));
        }

        function appendCPFInputCard() {
            // Campo do cliente (direita)
            const wrapper = document.createElement('div');
            wrapper.className = 'message';
            wrapper.style.justifyContent = 'flex-end';

            const card = document.createElement('div');

                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="currentColor" width="22" height="22" aria-hidden="true">
                        <path d="M476.59 227.05l-.16-.07L49.35 49.84A23.56 23.56 0 0027.14 52 24.65 24.65 0 0016 72.59v113.29a24 24 0 0019.52 23.57l232.93 43.07a4 4 0 010 7.86L35.53 303.45A24 24 0 0016 327v113.31A23.57 23.57 0 0026.59 460a23.94 23.94 0 0013.22 4 24.55 24.55 0 009.52-1.93L476.4 285.94l.19-.09a32 32 0 000-58.8z"></path>
                    </svg>
                </button>
            `;

            wrapper.appendChild(card);
            chat.appendChild(wrapper);
            scrollToBottom();

            const input = card.querySelector('#cpfInput');
            const sendBtn = card.querySelector('#sendBtn');

            card.addEventListener('click', () => input.focus());
            input.focus();

            // Aplica máscara enquanto digita
            input.addEventListener('input', (e) => {
                const formatted = formatCPF(e.target.value);
                e.target.value = formatted;
            });

            // CPF de teste: 01234567890 (para facilitar testes)
            // Descomente a linha abaixo para preencher automaticamente:
            // input.value = '012.345.678-90';

            const submit = async () => {
                const cpfValue = input.value.trim();
                if (!cpfValue) return;
                
                const cleanCPF = cpfValue.replace(/\D/g, '');
                if (cleanCPF.length !== 11) {
                    appendBotMessage('Por favor, digite um CPF válido com 11 dígitos.');
                return;
            }

                if (!validateCPF(cpfValue)) {
                    appendBotMessage('CPF inválido. Por favor, verifique os dígitos e tente novamente.');
                return;
            }

                await handleCPFSend(cpfValue, card);
            };

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') submit();
            });
            sendBtn.addEventListener('click', submit);
        }

        function formatCEP(value) {
            // Remove tudo que não é dígito
            const cep = value.replace(/\D/g, '');
            // Aplica a máscara CEP: 00000-000
            if (cep.length <= 5) return cep;
            return cep.replace(/(\d{5})(\d)/, '$1-$2');
        }

        function appendAddressInputCard() {
            // Campo do cliente (direita)
            const wrapper = document.createElement('div');
            wrapper.className = 'message';
            wrapper.style.justifyContent = 'flex-end';

            const card = document.createElement('div');
            card.className = 'input-card';
            card.id = 'addressCard';
            card.innerHTML = `
                <input id="addressInput" type="text" placeholder="Endereço completo ou CEP" autocomplete="address-line1" maxlength="200">
                <button type="button" class="send-icon-btn" id="sendBtn" aria-label="Enviar">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="currentColor" width="22" height="22" aria-hidden="true">
                        <path d="M476.59 227.05l-.16-.07L49.35 49.84A23.56 23.56 0 0027.14 52 24.65 24.65 0 0016 72.59v113.29a24 24 0 0019.52 23.57l232.93 43.07a4 4 0 010 7.86L35.53 303.45A24 24 0 0016 327v113.31A23.57 23.57 0 0026.59 460a23.94 23.94 0 0013.22 4 24.55 24.55 0 009.52-1.93L476.4 285.94l.19-.09a32 32 0 000-58.8z"></path>
                    </svg>
                </button>
            `;

            wrapper.appendChild(card);
            chat.appendChild(wrapper);
            scrollToBottom();

            const input = card.querySelector('#addressInput');
            const sendBtn = card.querySelector('#sendBtn');

            card.addEventListener('click', () => input.focus());
            input.focus();

            // Detecta se é CEP (apenas números) e aplica máscara
            input.addEventListener('input', (e) => {
                const value = e.target.value;
                // Remove espaços para verificação
                const cleanValue = value.replace(/\s/g, '');
                // Verifica se é realmente um CEP: apenas números e hífen, sem letras, vírgulas ou outros caracteres
                // E tem no máximo 9 caracteres (8 dígitos + 1 hífen)
                const isOnlyNumbersAndDash = /^[\d-]+$/.test(cleanValue);
                const hasNoLetters = !/[a-zA-Z]/.test(value);
                const hasNoCommas = !/,/.test(value);
                const isShortEnough = cleanValue.length <= 9;
                
                // Só aplica máscara se for claramente um CEP (sem letras, vírgulas, e apenas números/hífen)
                if (isOnlyNumbersAndDash && hasNoLetters && hasNoCommas && isShortEnough) {
                    const formatted = formatCEP(value);
                    e.target.value = formatted;
                }
            });

            let isSubmitting = false; // Flag para evitar múltiplos envios

            const submit = async () => {
                if (isSubmitting) return; // Evitar múltiplos envios
                
                const addressValue = input.value.trim();
                if (!addressValue) return;
                
                isSubmitting = true;
                
                // Desabilitar input e botão para evitar múltiplos envios
                input.disabled = true;
                sendBtn.disabled = true;
                
                // Salvar o valor antes de processar
                const savedValue = addressValue;
                
                // Limpar o input apenas visualmente após salvar
                input.value = '';
                
                // Processar o endereço
                await handleAddressSend(savedValue, card);
                
                // Não reabilitar o input, pois o card será escondido
            };

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault(); // Prevenir comportamento padrão do form
                    e.stopPropagation(); // Parar propagação do evento
                    submit();
                }
            });
            sendBtn.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                submit();
            });
        }

        function generateWrongDates(correctDate) {
            // Formato esperado: DD/MM/YYYY
            const [day, month, year] = correctDate.split('/');
            const wrongDates = [];
            
            // Gera 3 datas erradas variando dia, mês ou ano
            for (let i = 0; i < 3; i++) {
                let wrongDay = parseInt(day);
                let wrongMonth = parseInt(month);
                let wrongYear = parseInt(year);
                
                // Varia aleatoriamente
                if (i === 0) {
                    wrongDay = (wrongDay + Math.floor(Math.random() * 10) + 1) % 28 + 1;
                } else if (i === 1) {
                    wrongMonth = (wrongMonth + Math.floor(Math.random() * 6) + 1) % 12 + 1;
                } else {
                    wrongYear = wrongYear + (Math.random() > 0.5 ? 1 : -1) * (Math.floor(Math.random() * 5) + 1);
                }
                
                wrongDates.push(`${wrongDay.toString().padStart(2, '0')}/${wrongMonth.toString().padStart(2, '0')}/${wrongYear}`);
            }
            
            return wrongDates;
        }

        function parseAddressFromGoogle(formattedAddress) {
            // Tenta extrair componentes do endereço formatado do Google
            // Exemplo: "Rua Exemplo, 123 - Centro, São Paulo - SP, 01234-567, Brasil"
            const parts = formattedAddress.split(',').map(p => p.trim());
            let rua = parts[0] || '';
            let numero = '';
            let bairro = '';
            let cidade = '';
            let estado = '';
            
            // Tenta extrair número da rua (pode estar na primeira parte)
            const ruaMatch = rua.match(/^(.+?)\s*,\s*(\d+)/);
            if (ruaMatch) {
                rua = ruaMatch[1].trim();
                numero = ruaMatch[2];
            } else {
                // Tenta extrair número da segunda parte
                if (parts.length > 1 && /^\d+/.test(parts[1])) {
                    numero = parts[1].match(/^\d+/)[0];
                    rua = parts[0];
                }
            }
            
            // Bairro geralmente está na segunda ou terceira parte (pode ter "-" antes)
            if (parts.length > 1) {
                const part2 = parts[1];
                if (!/^\d+/.test(part2) && !part2.match(/^[A-Z]{2}$/)) {
                    bairro = part2.replace(/^-\s*/, '').trim();
                }
            }
            
            // Cidade e estado geralmente estão juntos
            for (let i = 2; i < parts.length; i++) {
                const part = parts[i];
                if (part.match(/^[A-Z]{2}$/)) {
                    estado = part;
                    if (i > 2) {
                        cidade = parts[i - 1].replace(/^-\s*/, '').trim();
                    }
                    break;
                }
            }
            
            // Se não encontrou cidade/estado, tenta padrão "Cidade - Estado"
            if (!cidade && parts.length > 2) {
                const cidadeEstadoMatch = parts[2].match(/^(.+?)\s*-\s*([A-Z]{2})/);
                if (cidadeEstadoMatch) {
                    cidade = cidadeEstadoMatch[1].trim();
                    estado = cidadeEstadoMatch[2];
                }
            }
            
            return { rua: rua || formattedAddress, numero: numero || 's/n', bairro: bairro || '', cidade: cidade || '', estado: estado || '' };
        }

            naoBtn.style.background = '#fff';
            naoBtn.style.color = '#ee4d2d';
            naoBtn.style.border = '2px solid #ee4d2d';
            naoBtn.textContent = 'NÃO';
            naoBtn.addEventListener('click', async () => {
                mapWrapper.remove();
                buttonsWrapper.remove();
                appendBotMessage('Por favor, digite o endereço correto ou o CEP novamente.');
                await wait(300);
                appendAddressInputCard();
            });

            buttonsContainer.appendChild(simBtn);
            buttonsContainer.appendChild(naoBtn);
            buttonsBubble.appendChild(buttonsContainer);
            buttonsContent.appendChild(buttonsBubble);
            buttonsWrapper.appendChild(buttonsAvatar);
            buttonsWrapper.appendChild(buttonsContent);
            chat.appendChild(buttonsWrapper);
            scrollToBottom();
        }

        const wait = (ms) => new Promise(r => setTimeout(r, ms));
        const waitHuman = (minMs, maxMs) => wait(Math.floor(minMs + Math.random() * (maxMs - minMs)));

        async function startFlow() {
            // 🟢 Mensagem 1 — boas-vindas (Delay: 400ms – 700ms)
            let t = appendBotTyping();
            await waitHuman(400, 700);
            t.remove();
            appendBotMessage('Oi 😊\n<strong>Eu sou a Andressa</strong>, atendente virtual, e vou te ajudar a <strong>finalizar seu pedido</strong> agora mesmo.');

            // 🟢 Mensagem 2 — pergunta do CPF (Delay: 600ms – 900ms após a primeira)
            t = appendBotTyping();
            await waitHuman(600, 900);
            t.remove();
            appendBotMessage('<strong>Seu CPF é necessário para finalizar essa etapa do pedido.</strong>');

            // 🟢 Input "CPF" — aparecer 300ms depois da pergunta + foco automático
            await wait(300);
            appendCPFInputCard();
        }

        async function speak(text) {
            try {
                const res = await fetch('/api/tts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text,
                        model_id: modelId,
                        voice_id: voiceId,
                        language
                    })
                });

                if (!res.ok) return;

                const audioBlob = await res.blob();
                return URL.createObjectURL(audioBlob);
            } catch (e) {
                console.error(e);
            }
        }

        async function handleCPFSend(cpf, cardEl) {
            if (!cpf) return;
            if (cardEl) cardEl.classList.add('hidden');

            appendUserMessage(cpf);

            // Mostrar indicador de digitação durante a consulta
            const typingEl = appendBotTyping();

            // Consultar CPF na API
            try {
                const response = await fetch(`/api/verify-cpf?cpf=${encodeURIComponent(cpf)}`);
                
                // Remove o indicador de digitação quando a resposta chegar
                typingEl.remove();
                
                let data;
                try {
                    data = await response.json();
                } catch (jsonError) {
                    appendBotMessage('❌ Erro ao processar resposta do servidor. Tente novamente.');
                    console.error('Erro ao parsear JSON:', jsonError);
                    return;
                }
                
                if (!response.ok) {
                    const errorMsg = data?.error || `Erro ${response.status}: ${response.statusText}`;
                    appendBotMessage(`❌ ${errorMsg}`);
                    console.error('Erro na verificação de CPF:', { status: response.status, data });
                    return;
                }

                // CPF verificado com sucesso - etapa de confirmação de data de nascimento
                const nome = data.NOME || data.nome || '';
                const dataNascimento = data.NASC || data.nasc || ''; // Formato: DD/MM/YYYY
                
                // Armazenar dados do usuário globalmente
                window.chatUserFullName = nome;
                window.chatUserCPF = cpf.replace(/\D/g, '');
                window.chatCPFData = data; // Armazenar dados completos do CPF
                
                // Áudio de confirmação
                await waitHuman(400, 600);
                const recEl = appendBotRecording();
                const primeiroNome = nome ? nome.split(' ')[0] : '';
                let confirmText = primeiroNome ? `Olá, ${primeiroNome}. Para confirmarmos que é você, selecione abaixo a sua data de nascimento.` : 'Para confirmarmos que é você, selecione abaixo a sua data de nascimento.';
                
                const audioUrl = await speak(confirmText);
                await waitHuman(900, 1400);
                recEl.remove();
                
                // Aguardar o áudio terminar completamente + 2 segundos
                if (audioUrl) {
                    await appendAudioMessage(audioUrl);
                    await wait(2000);
                } else {
                    await waitHuman(800, 1200);
                }

                // Mensagem de texto com subtexto
                appendBotMessage('Para confirmarmos que é você, selecione abaixo a sua data de nascimento.', 'É uma etapa rápida de segurança pra finalizar seu pedido.');

                // Mostrar opções de data de nascimento
                await wait(300);
                await showDateOptions(dataNascimento, nome);

            } catch (error) {
                appendBotMessage('❌ Erro ao verificar CPF. Por favor, tente novamente.');
                console.error('Erro ao verificar CPF:', error);
            }
        }

        async function appendAudioMessage(audioUrl) {

            // Mensagem do suporte com áudio (sem texto)
            const wrapper = document.createElement('div');
            wrapper.className = 'message';

            const avatar = document.createElement('div');
            avatar.className = 'message__avatar';
            const avatarImg = document.createElement('img');
            avatarImg.src = '/assets/Screenshot_5.png';
            avatarImg.alt = 'Andressa';
            avatar.appendChild(avatarImg);

            const content = document.createElement('div');
            const bubble = document.createElement('div');
            bubble.className = 'bubble audio-bubble';

            // Player custom
            const audio = document.createElement('audio');
            audio.src = audioUrl;
            audio.preload = 'metadata';

            const ui = document.createElement('div');
            ui.className = 'audio-ui';

            const playBtn = document.createElement('button');
            playBtn.type = 'button';
            playBtn.className = 'audio-play';
            playBtn.setAttribute('aria-label', 'Reproduzir');
            playBtn.innerHTML = `
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
                    <path d="M8 5v14l11-7z"></path>
                </svg>
            `;

            const track = document.createElement('div');
            track.className = 'audio-track';

            const progress = document.createElement('div');
            progress.className = 'audio-progress';
            const bar = document.createElement('div');
            bar.className = 'audio-progress__bar';
            progress.appendChild(bar);

            const meta = document.createElement('div');
            meta.className = 'audio-meta';
            const timeLeft = document.createElement('span');
            timeLeft.textContent = '0:00';
            const timeRight = document.createElement('span');
            timeRight.textContent = '0:00';
            meta.appendChild(timeLeft);
            meta.appendChild(timeRight);

            track.appendChild(progress);
            track.appendChild(meta);

            ui.appendChild(playBtn);
            ui.appendChild(track);

            bubble.appendChild(ui);
            bubble.appendChild(audio);
            content.appendChild(bubble);
            wrapper.appendChild(avatar);
            wrapper.appendChild(content);
            chat.appendChild(wrapper);
            scrollToBottom();

            const fmt = (s) => {
                if (!isFinite(s) || s < 0) return '0:00';
                const m = Math.floor(s / 60);
                const r = Math.floor(s % 60).toString().padStart(2, '0');
                return `${m}:${r}`;
            };

            const setPlaying = (isPlaying) => {
                playBtn.innerHTML = isPlaying
                    ? `<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"></path></svg>`
                    : `<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>`;
            };

            playBtn.addEventListener('click', async () => {
                if (audio.paused) {
                    try { await audio.play(); } catch {}
                } else {
                    audio.pause();
                }
            });

            progress.addEventListener('click', (e) => {
                const rect = progress.getBoundingClientRect();
                const pct = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
                if (isFinite(audio.duration)) {
                    audio.currentTime = pct * audio.duration;
                }
            });

            audio.addEventListener('loadedmetadata', () => {
                timeRight.textContent = fmt(audio.duration);
            });
            audio.addEventListener('play', () => setPlaying(true));
            audio.addEventListener('pause', () => setPlaying(false));
            audio.addEventListener('ended', () => setPlaying(false));
            audio.addEventListener('timeupdate', () => {
                if (isFinite(audio.duration) && audio.duration > 0) {
                    const pct = (audio.currentTime / audio.duration) * 100;
                    bar.style.width = `${pct}%`;
                    timeLeft.textContent = fmt(audio.currentTime);
                }
            });

            // Autoplay e retornar Promise que resolve quando o áudio terminar
            return new Promise((resolve) => {
                let resolved = false;
                const doResolve = () => {
                    if (!resolved) {
                        resolved = true;
                        resolve();
                    }
                };

                const onEnded = () => {
                    audio.removeEventListener('ended', onEnded);
                    doResolve();
                };
                audio.addEventListener('ended', onEnded);
                
                // Tenta tocar o áudio
                const tryPlay = async () => {
                    try {
                        await audio.play();
                    } catch (err) {
                        // Se não conseguir tocar, estima duração baseada no metadata ou usa fallback
                        if (audio.duration && isFinite(audio.duration)) {
                            setTimeout(doResolve, audio.duration * 1000);
                        } else {
                            setTimeout(doResolve, 3000);
                        }
                    }
                };

                // Se já tem metadata, tenta tocar
                if (audio.readyState >= 2) {
                    tryPlay();
                } else {
                    audio.addEventListener('loadedmetadata', tryPlay, { once: true });
                }
                
                // Fallback: se não carregar em 5 segundos, resolve
                setTimeout(doResolve, 5000);
            });
        }

        // Função para calcular dias úteis (exclui sábados e domingos)
        function addBusinessDays(date, days) {
            let result = new Date(date);
            let addedDays = 0;
            
            while (addedDays < days) {
                result.setDate(result.getDate() + 1);
                const dayOfWeek = result.getDay();
                // Se não for sábado (6) nem domingo (0), conta como dia útil
                if (dayOfWeek !== 0 && dayOfWeek !== 6) {
                    addedDays++;
                }
            }
            
            return result;
        }

        // Função para formatar data no formato DD/MM/YYYY
        function formatDate(date) {
            const day = date.getDate().toString().padStart(2, '0');
            const month = (date.getMonth() + 1).toString().padStart(2, '0');
            const year = date.getFullYear();
            return `${day}/${month}/${year}`;
        }

        // Função para formatar CPF (XXX.XXX.XXX-XX)
        function formatCPF(cpf) {
            const cleaned = cpf.replace(/\D/g, '');
            if (cleaned.length !== 11) return cpf;
            return cleaned.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
        }
